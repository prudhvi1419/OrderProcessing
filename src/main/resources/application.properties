spring.application.name=order-processing

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/order_processing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:orders}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orders}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Run schema.sql (defines commission_results) on startup, before Hibernate
spring.sql.init.mode=always

# Kafka: consume advisor and order events (JSON, no type headers) from the upstream system
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-processing
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.orderprocessing.messaging

app.kafka.order-topic=${APP_ORDER_TOPIC:orders.events}
app.kafka.advisor-topic=${APP_ADVISOR_TOPIC:advisors.events}

# Time zone that decides commission periods and the schedule
app.time-zone=${APP_TIME_ZONE:UTC}

# ---------------------------------------------------------------------------
# Commission rules
# commission = number of sales in the month x amount-per-sale
# Example: 5 sales x 100 = 500
# ---------------------------------------------------------------------------

# Scheduled run for the previous month: 02:00 on the 1st of every month. Use "-" to disable.
app.commission.schedule-cron=${APP_COMMISSION_CRON:0 0 2 1 * *}

# Fixed amount paid for each sale
app.commission.amount-per-sale=${APP_COMMISSION_AMOUNT_PER_SALE:100}

# Only orders in these statuses count as a sale
app.commission.eligible-order-statuses=COMPLETED

# Logging
logging.level.root=INFO
logging.level.org.example.orderprocessing=${APP_LOG_LEVEL:INFO}
logging.file.name=${LOG_FILE:logs/order-processing.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
